[package]
name = "umwelt"
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
description = "Interest management for real-time simulation: spatial subscription, priority accumulation, and per-viewer bandwidth budgeting."
license = "Apache-2.0"
repository = "https://github.com/umwelt-sim/umwelt-rs"
readme = "README.md"
keywords = ["gamedev", "networking", "replication", "multiplayer", "simulation"]
categories = ["game-development", "network-programming", "simulation"]
include = ["src/**/*", "README.md", "LICENSE"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
# ADR 0001: the region-to-edge transport is NATS. These are the crate's first
# dependencies, and tokio arrives through async-nats rather than by choice.
async-nats = "0.50"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# Named so a payload can reach an edge without a copy; async-nats already uses it.
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = "0.8.2"

[[example]]
name = "herd-sim"
path = "examples/herd-sim.rs"

[[example]]
name = "herd-edge"
path = "examples/herd-edge.rs"

[[bench]]
name = "subscription"
harness = false

[[bench]]
name = "gather"
harness = false

[[bench]]
name = "odometer"
harness = false

[[bench]]
name = "ghost"
harness = false

[[bench]]
name = "select"
harness = false

[[bench]]
name = "pipeline"
harness = false
