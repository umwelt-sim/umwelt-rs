[package]
name = "umwelt"
version = "0.0.1"
edition = "2024"
rust-version = "1.86"
description = "Interest management for real-time simulation: spatial subscription, priority accumulation, and per-viewer bandwidth budgeting."
license = "Apache-2.0"
repository = "https://github.com/umwelt-sim/umwelt-rs"
readme = "README.md"
keywords = ["gamedev", "networking", "replication", "multiplayer", "simulation"]
categories = ["game-development", "network-programming", "simulation"]
include = ["src/**/*", "docs/**/*", "DESIGN.md", "README.md", "LICENSE"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
# ADR 0001: the region-to-edge transport is NATS. These are the crate's first
# dependencies, and tokio arrives through async-nats rather than by choice.
async-nats = "0.50"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# Named so a payload can reach an edge without a copy; async-nats already uses it.
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
# ADR 0006: the edge-to-client transport. The caller supplies a bound endpoint,
# so certificates and the crypto provider stay with the deployment and this
# crate never installs a process-global default.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }

[dev-dependencies]
criterion = "0.8.2"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }

[[bench]]
name = "subscription"
harness = false

[[bench]]
name = "gather"
harness = false

[[bench]]
name = "odometer"
harness = false

[[bench]]
name = "ghost"
harness = false

[[bench]]
name = "select"
harness = false

[[bench]]
name = "pipeline"
harness = false
