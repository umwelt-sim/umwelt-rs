# The width this crate is written to. 99% of its lines fit inside 90 columns
# and the wrapping was done by hand at that boundary, so the 100 rustfmt
# defaults to would rejoin lines that were split deliberately.
max_width = 90

# Keep a single call, struct literal or array on one line up to the full width
# rather than 60% of it, which is how the code is already written.
use_small_heuristics = "Max"
